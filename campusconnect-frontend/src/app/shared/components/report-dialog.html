<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 px-4">
  <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-6">

    @if (submitted()) {
      <div class="text-center py-4">
        <p class="text-3xl mb-3">✓</p>
        <h3 class="font-semibold text-gray-900 mb-1">Report Submitted</h3>
        <p class="text-sm text-gray-500 mb-4">Our admin team will review this shortly.</p>
        <button (click)="close()" class="text-indigo-600 font-medium text-sm hover:underline">Close</button>
      </div>
    } @else {
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-semibold text-gray-900">Report an issue</h3>
        <button (click)="close()" class="text-gray-400 hover:text-gray-600">✕</button>
      </div>

      <label class="block text-sm font-medium text-gray-700 mb-1">Reason</label>
      <input [(ngModel)]="reason" placeholder="e.g. Misleading information, inappropriate content"
             class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-red-500" />

      <label class="block text-sm font-medium text-gray-700 mb-1">Additional details (optional)</label>
      <textarea [(ngModel)]="description" rows="3"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-red-500"></textarea>

      @if (error()) { <p class="text-red-500 text-sm mb-3">{{ error() }}</p> }

      <div class="flex gap-2">
        <button (click)="submit()" [disabled]="submitting()"
                class="flex-1 bg-red-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-red-700 disabled:opacity-50">
          {{ submitting() ? 'Submitting...' : 'Submit Report' }}
        </button>
        <button (click)="close()" class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-600 hover:bg-gray-50">
          Cancel
        </button>
      </div>
    }
  </div>
</div>
