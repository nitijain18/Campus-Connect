<div class="min-h-screen bg-slate-50">
  <div class="max-w-6xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-8 animate-fade-in-up">Colleges</h1>

    @if (loading()) {
      <p class="text-slate-400">Loading...</p>
    } @else if (colleges().length === 0) {
      <p class="text-slate-400">No colleges available.</p>
    } @else {
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
        @for (college of colleges(); track college.id; let i = $index) {
          <a [routerLink]="['/colleges', college.id]"
             class="animate-fade-in-up bg-white rounded-2xl border border-slate-200 p-6 hover:shadow-lg hover:shadow-slate-900/5 hover:border-primary-200 hover:-translate-y-1 transition-all block"
             [style.animation-delay]="(i % 9) * 0.05 + 's'">
            <div class="h-10 w-10 rounded-xl bg-primary-50 flex items-center justify-center text-lg mb-3">🏫</div>
            <h3 class="font-bold text-slate-900">{{ college.name }}</h3>
            <p class="text-sm text-slate-500 mt-1">{{ college.city }}, {{ college.state }}</p>
          </a>
        }
      </div>
    }
  </div>
</div>
