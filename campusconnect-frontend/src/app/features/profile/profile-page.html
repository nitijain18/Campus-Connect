<div class="min-h-screen bg-slate-50 py-10 px-4">
  <div class="max-w-lg mx-auto bg-white rounded-3xl shadow-xl shadow-slate-900/5 border border-slate-100 p-8 animate-fade-in-up">
    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight mb-6">My Profile</h1>

    <div class="flex flex-col items-center mb-7">
      @if (authService.currentUser()?.profileImage) {
        <img [src]="authService.currentUser()?.profileImage" class="h-24 w-24 rounded-full object-cover mb-3 ring-4 ring-primary-100" />
      } @else {
        <div class="h-24 w-24 rounded-full bg-gradient-to-br from-primary-400 to-primary-600 text-white flex items-center justify-center text-3xl font-bold mb-3">
          {{ authService.currentUser()?.firstName?.charAt(0) }}
        </div>
      }
      <label class="text-sm text-primary-600 font-semibold cursor-pointer hover:text-primary-700">
        {{ uploadingPhoto() ? 'Uploading...' : 'Change photo' }}
        <input type="file" accept="image/*" class="hidden" (change)="onPhotoSelected($event)" [disabled]="uploadingPhoto()" />
      </label>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">First Name</label>
          <input formControlName="firstName" type="text"
                 class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Last Name</label>
          <input formControlName="lastName" type="text"
                 class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Email</label>
        <input [value]="authService.currentUser()?.email" disabled
               class="w-full px-3.5 py-2.5 border border-slate-100 bg-slate-50 rounded-xl text-slate-400 text-sm" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Phone Number</label>
        <input formControlName="phoneNumber" type="text"
               class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition" />
      </div>

      @if (successMessage()) { <p class="text-primary-700 text-sm bg-primary-50 border border-primary-100 rounded-lg px-3 py-2">{{ successMessage() }}</p> }
      @if (errorMessage()) { <p class="text-red-500 text-sm bg-red-50 border border-red-100 rounded-lg px-3 py-2">{{ errorMessage() }}</p> }

      <button type="submit" [disabled]="loading()"
              class="w-full bg-primary-600 text-white py-3 rounded-xl font-semibold hover:bg-primary-500 hover:shadow-lg hover:shadow-primary-600/25 transition-all disabled:opacity-50">
        {{ loading() ? 'Saving...' : 'Save Changes' }}
      </button>
    </form>
  </div>
</div>
