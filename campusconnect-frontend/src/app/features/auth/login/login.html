<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 relative overflow-hidden">
  <div class="absolute bottom-0 right-1/3 h-96 w-96 bg-primary-400 rounded-full blur-3xl opacity-10"></div>

  <div class="relative w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-900/5 border border-slate-100 p-8 animate-fade-in-up">
    <div class="h-12 w-12 rounded-2xl bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center text-xl mb-5">🎓</div>
    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight mb-1">Welcome back</h1>
    <p class="text-slate-500 mb-7 text-sm">Log in to your CampusConnect account</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Email</label>
        <input formControlName="email" type="email"
               class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1.5">Password</label>
        <input formControlName="password" type="password"
               class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition" />
      </div>

      @if (errorMessage()) {
        <p class="text-red-500 text-sm bg-red-50 border border-red-100 rounded-lg px-3 py-2 animate-fade-in">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="loading()"
              class="w-full bg-primary-600 text-white py-3 rounded-xl font-semibold hover:bg-primary-500 hover:shadow-lg hover:shadow-primary-600/25 transition-all disabled:opacity-50 disabled:hover:shadow-none">
        {{ loading() ? 'Logging in...' : 'Log In' }}
      </button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-7">
      Don't have an account?
      <a routerLink="/signup" class="text-primary-600 font-semibold hover:text-primary-700">Sign up</a>
    </p>
  </div>
</div>
