<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4 relative overflow-hidden">
  <div class="absolute top-1/3 left-1/4 h-96 w-96 bg-primary-400 rounded-full blur-3xl opacity-10"></div>

  <div class="relative w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-900/5 border border-slate-100 p-8 text-center animate-fade-in-up">
    <div class="h-14 w-14 rounded-2xl bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center text-2xl mb-5 mx-auto">✉️</div>
    <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight mb-1">Verify your email</h1>
    <p class="text-slate-500 mb-7 text-sm">Enter the 6-digit code sent to <span class="font-semibold text-slate-700">{{ email }}</span></p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
      <input formControlName="otp" type="text" maxlength="6" placeholder="000000"
             class="w-full text-center text-2xl font-bold tracking-[0.5em] px-3 py-3.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition" />
      @if (form.get('otp')?.invalid && form.get('otp')?.touched) {
        <p class="text-red-500 text-xs">Enter a valid 6-digit code</p>
      }

      @if (errorMessage()) {
        <p class="text-red-500 text-sm bg-red-50 border border-red-100 rounded-lg px-3 py-2 animate-fade-in">{{ errorMessage() }}</p>
      }
      @if (successMessage()) {
        <p class="text-primary-700 text-sm bg-primary-50 border border-primary-100 rounded-lg px-3 py-2 animate-fade-in">{{ successMessage() }}</p>
      }

      <button type="submit" [disabled]="loading()"
              class="w-full bg-primary-600 text-white py-3 rounded-xl font-semibold hover:bg-primary-500 hover:shadow-lg hover:shadow-primary-600/25 transition-all disabled:opacity-50 disabled:hover:shadow-none">
        {{ loading() ? 'Verifying...' : 'Verify' }}
      </button>
    </form>

    <button (click)="resendOtp()" [disabled]="resending()"
            class="text-primary-600 text-sm font-semibold mt-5 hover:text-primary-700 disabled:opacity-50">
      {{ resending() ? 'Resending...' : "Didn't get a code? Resend" }}
    </button>
  </div>
</div>
