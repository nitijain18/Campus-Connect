<div class="min-h-screen bg-slate-50">
  <div class="max-w-6xl mx-auto px-4 py-10">
    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-8 animate-fade-in-up">My Wishlist</h1>

    @if (loading()) {
      <p class="text-slate-400">Loading...</p>
    } @else if (events().length === 0) {
      <div class="text-center py-24 animate-fade-in">
        <p class="text-5xl mb-4">♡</p>
        <p class="text-slate-500 mb-5">Your wishlist is empty.</p>
        <a routerLink="/events" class="inline-block bg-primary-600 text-white px-5 py-2.5 rounded-xl font-semibold text-sm hover:bg-primary-500 transition">Browse events</a>
      </div>
    } @else {
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (event of events(); track event.id; let i = $index) {
          <div class="animate-fade-in-up" [style.animation-delay]="(i % 6) * 0.05 + 's'">
            <app-event-card [event]="event" />
          </div>
        }
      </div>
    }
  </div>
</div>
