<div class="min-h-screen bg-slate-50 py-12 px-4">
  <div class="max-w-lg mx-auto bg-white rounded-3xl shadow-xl shadow-slate-900/5 border border-slate-100 p-8 animate-fade-in-up">

    @if (submitted()) {
      <div class="text-center py-8 animate-scale-in">
        <p class="text-5xl mb-4">✅</p>
        <h2 class="text-xl font-bold text-slate-900 mb-2">Application Submitted</h2>
        <p class="text-slate-500">We'll notify you once an admin reviews your vendor application.</p>
      </div>
    } @else {
      <div class="h-12 w-12 rounded-2xl bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center text-xl mb-5">🎤</div>
      <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight mb-1">Become a Vendor</h1>
      <p class="text-slate-500 mb-7 text-sm">Host events on CampusConnect — fill out your business details below.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Business Name</label>
          <input formControlName="businessName" type="text"
                 class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Description</label>
          <textarea formControlName="description" rows="3"
                    class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">City</label>
          <input formControlName="city" type="text"
                 class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">GSTIN (optional)</label>
          <input formControlName="gstin" type="text"
                 class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition" />
        </div>

        <div class="border-t border-slate-100 pt-4">
          <p class="text-sm font-semibold text-slate-700 mb-3">Bank Details (for payouts)</p>

          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">Account Holder Name</label>
              <input formControlName="accountHolderName" type="text"
                     class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">Bank Account Number</label>
              <input formControlName="bankAccountNumber" type="text"
                     class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">IFSC Code</label>
              <input formControlName="ifscCode" type="text"
                     class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 transition" />
            </div>
          </div>
        </div>

        @if (errorMessage()) {
          <p class="text-red-500 text-sm bg-red-50 border border-red-100 rounded-lg px-3 py-2">{{ errorMessage() }}</p>
        }

        <button type="submit" [disabled]="loading()"
                class="w-full bg-primary-600 text-white py-3 rounded-xl font-semibold hover:bg-primary-500 hover:shadow-lg hover:shadow-primary-600/25 transition-all disabled:opacity-50">
          {{ loading() ? 'Submitting...' : 'Submit Application' }}
        </button>
      </form>
    }
  </div>
</div>
